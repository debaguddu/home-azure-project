resources:
  jobs:
    service_cleanup_tables:
      name: Service_Cleanup_Tables
      email_notifications:
        no_alert_for_skipped_runs: false
      webhook_notifications: {}
      timeout_seconds: 0
      max_concurrent_runs: 1
      tasks:
        - task_key: run_cleanup_tables
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Shared/home-azure-project/databricks/notebooks/nb_service_cleanup_tables
            base_parameters:
              source_table_name: ALL
              target_catalog: bronze_catalog
              target_schema: raw_data
              volume_catalog: landing_catalog
              volume_schema: source_sql
              landing_container: landing
              bronze_container: bronze
              storage_account_name: azureprojectdevadls01
              folder_prefix: home/datalake/claims
              drop_uc_table: "true"
              delete_raw_path: "true"
              delete_landing_path: "true"
              delete_bronze_path: "true"
              drop_uc_volume: "false"
            source: WORKSPACE
          max_retries: 0
          min_retry_interval_millis: 900000
          retry_on_timeout: false
          disable_auto_optimization: true
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}
          environment_key: Default
          disabled: false
      git_source:
        git_url: https://github.com/debaguddu/home-azure-project.git
        git_provider: gitHub
        git_branch: develop
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
