resources:
  jobs:
    bronze_to_silver:
      name: Bronze_to_Silver
      email_notifications:
        no_alert_for_skipped_runs: false
      webhook_notifications: {}
      timeout_seconds: 0
      max_concurrent_runs: 1
      tasks:
        - task_key: transform_bronze_to_silver
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Shared/home-azure-project/databricks/notebooks/nb_transform_bronze_to_silver
            base_parameters:
              bronze_catalog: bronze_catalog
              bronze_schema: raw_data
              silver_catalog: silver_catalog
              silver_schema: insurance_conformed
            source: WORKSPACE
          max_retries: 0
          min_retry_interval_millis: 900000
          retry_on_timeout: false
          disable_auto_optimization: true
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}
          environment_key: Default
          disabled: false
      git_source:
        git_url: https://github.com/debaguddu/home-azure-project.git
        git_provider: gitHub
        git_branch: project01
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED

